<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายงานสรุปการประชุม</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f5f7; margin: 0; padding: 40px 16px; }
    .card { max-width: 720px; margin: 0 auto 24px; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin-top: 0; }
    pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; line-height: 1.6; }
    details summary { cursor: pointer; color: #666; margin-top: 8px; }
    a.back { display: inline-block; margin-bottom: 16px; color: #333; text-decoration: none; }
  </style>
</head>
<body>
  <a class="back" href="/">← สรุปไฟล์อื่น</a>
  <div class="card">
    <h1>สรุปการประชุม</h1>
    <pre>{{ report }}</pre>
  </div>
  <div class="card">
    <details>
      <summary>ดูบทถอดเสียงเต็ม</summary>
      <pre>{{ transcript }}</pre>
    </details>
  </div>
</body>
</html>
